<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" style="background:#0b0f19;border-radius:16px;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="700" cy="80" r="180" fill="url(#glowGrad)"/>
  <circle cx="100" cy="350" r="150" fill="url(#glowGrad)"/>

  <!-- Header Section -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="16" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600" fill="#38bdf8">COMPOSE MULTIPLATFORM</text>
    <text x="0" y="52" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="24" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">cmp-biometrics</text>
    <text x="0" y="74" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" fill="#94a3b8">Unified Face ID, Touch ID &amp; Android BiometricPrompt for Compose</text>
  </g>

  <!-- Left Card: Biometric Scanner Mockup -->
  <g transform="translate(40, 130)" filter="url(#cardShadow)">
    <rect width="320" height="240" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Top Card Bar -->
    <circle cx="20" cy="20" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="36" cy="20" r="5" fill="#eab308" opacity="0.8"/>
    <circle cx="52" cy="20" r="5" fill="#22c55e" opacity="0.8"/>
    <text x="75" y="24" font-family="monospace" font-size="11" fill="#64748b">BiometricAuthentication.kt</text>

    <!-- Biometric Icon / Visual Graphic -->
    <g transform="translate(160, 110)">
      <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#0284c7" stroke-width="2" filter="url(#glow)"/>
      <!-- Fingerprint / Face Outline -->
      <path d="M-16 -12 C-12 -24, 12 -24, 16 -12 C18 -5, 14 6, 6 12 C-2 18, -6 22, -6 26" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-8 -6 C-6 -14, 6 -14, 8 -6 C9 -2, 7 4, 3 8" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <path d="M-22 0 C-20 -15, 20 -15, 22 0 C24 10, 16 20, 8 28" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <!-- Verified Badge -->
      <circle cx="28" cy="24" r="12" fill="#22c55e"/>
      <path d="M24 24 L27 27 L33 21" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Status Text -->
    <text x="160" y="185" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Biometric Verified</text>
    <text x="160" y="205" text-anchor="middle" font-family="monospace" font-size="11" fill="#22c55e">BiometricResult.Success</text>
  </g>

  <!-- Right Side: Architecture & Features -->
  <g transform="translate(390, 130)" filter="url(#cardShadow)">
    <rect width="370" height="240" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    
    <text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">UNIFIED RUNTIME PIPELINE</text>

    <!-- Architecture Boxes -->
    <g transform="translate(24, 46)">
      <!-- Box 1: CMP Compose -->
      <rect width="322" height="42" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
      <text x="14" y="25" font-family="monospace" font-size="12" font-weight="600" fill="#f8fafc">rememberBiometricManager()</text>
      <rect x="250" y="12" width="60" height="18" rx="4" fill="#0369a1"/>
      <text x="280" y="24" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff">COMMON</text>
    </g>

    <!-- Flow Arrows -->
    <path d="M100 95 L100 110 M260 95 L260 110" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Box 2: Android Bridge -->
    <g transform="translate(24, 115)">
      <rect width="154" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="24" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#4ade80">Android</text>
      <text x="12" y="44" font-family="monospace" font-size="10" fill="#94a3b8">BiometricPrompt</text>
    </g>

    <!-- Box 3: iOS Bridge -->
    <g transform="translate(192, 115)">
      <rect width="154" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="24" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#a78bfa">iOS (Apple)</text>
      <text x="12" y="44" font-family="monospace" font-size="10" fill="#94a3b8">LAContext (LocalAuth)</text>
    </g>

    <!-- Footer Author Tag -->
    <line x1="24" y1="192" x2="346" y2="192" stroke="#334155" stroke-width="0.8"/>
    <text x="24" y="215" font-family="-apple-system,sans-serif" font-size="11" fill="#94a3b8">Architected &amp; Crafted by <tspan fill="#38bdf8" font-weight="700">Govind Tank</tspan></text>
    <text x="346" y="215" text-anchor="end" font-family="monospace" font-size="11" fill="#64748b">v1.0.0</text>
  </g>
</svg>
